version: '3.8'

services:
  kbm-tenderscout:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kbm-tenderscout-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config
    environment:
      - TZ=Asia/Kuwait
