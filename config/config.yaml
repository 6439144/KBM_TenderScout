# ==============================================================================
# KBM Tender Monitoring Agent - Active Production Configuration
# ==============================================================================

app:
  name: "KBM Tender Monitoring Agent"
  version: "1.0.0"
  environment: "production"
  log_level: "INFO"

# ------------------------------------------------------------------------------
# 1. Compliance & Legal Verification (Rule 3.6 - Approved by Khaled Abed)
# ------------------------------------------------------------------------------
compliance:
  automation_permitted: true
  enforce_human_presence_until_permitted: false

# ------------------------------------------------------------------------------
# 2. Portal Configurations & Session Politeness
# ------------------------------------------------------------------------------
portals:
  capt:
    enabled: true
    name: "Central Agency for Public Tenders (CAPT)"
    base_url: "https://capt.gov.kw/ar/"
    login_url: "https://capt.gov.kw/ar/login"
    tenders_url: "https://capt.gov.kw/ar/tenders/opening-tenders/"
    auth:
      username_secret: "CAPT_USERNAME"
      password_secret: "CAPT_PASSWORD"
      account_type: "shared"
      has_otp: false
    rate_limiting:
      min_delay_seconds: 3.0
      max_delay_seconds: 8.0
      max_pages_per_run: 20
      max_retries_per_day: 1
    browser:
      headless: true
      timeout_ms: 35000
      user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36 (KBM-TenderScout-Reader)"

  kuwait_alyawm:
    enabled: true
    name: "Kuwait Al-Yawm Official Gazette"
    base_url: "https://kuwaitalyawm.media.gov.kw"
    login_url: "https://kuwaitalyawm.media.gov.kw/Account/LoginOnline"
    tenders_url: "https://kuwaitalyawm.media.gov.kw/online/AdsCategory/18"
    auth:
      username_secret: "ALYAWM_USERNAME"
      password_secret: "ALYAWM_PASSWORD"
      account_type: "shared"
      has_otp: false
    rate_limiting:
      min_delay_seconds: 3.0
      max_delay_seconds: 8.0
      max_pages_per_run: 20
      max_retries_per_day: 1
    browser:
      headless: true
      timeout_ms: 35000
      user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36 (KBM-TenderScout-Reader)"

# ------------------------------------------------------------------------------
# 3. Collection Rules & Notice Types
# ------------------------------------------------------------------------------
collect:
  notice_types:
    - "tender"
    - "practice"
    - "prequal"
    - "addendum"
    - "cancellation"
    - "award"
  backfill_days: 30
  download_attachments: false
  attachments_dir: "data/attachments"

# ------------------------------------------------------------------------------
# 4. Relevance Filtering (KBM ICT Domains)
# ------------------------------------------------------------------------------
filter:
  enabled: true
  mode: "tag_only"
  store_unmatched: true
  keywords_ar:
    - "شبكات"
    - "خوادم"
    - "حاسب آلي"
    - "برمجيات"
    - "أمن سيبراني"
    - "مراكز بيانات"
    - "تراخيص"
    - "صيانة أجهزة"
    - "بنية تحتية"
    - "تخزين بيانات"
    - "ألياف ضوئية"
    - "كاميرات مراقبة"
    - "نظم معلومات"
    - "أنظمة"
    - "حماية المعلومات"
    - "تقنية المعلومات"
    - "اتصالات"
    - "بوابة إلكترونية"
    - "حوسبة سحابية"
  keywords_en:
    - "server"
    - "servers"
    - "storage"
    - "network"
    - "networking"
    - "cyber"
    - "cybersecurity"
    - "cloud"
    - "license"
    - "licenses"
    - "hardware"
    - "software"
    - "datacenter"
    - "data center"
    - "infrastructure"
    - "cctv"
    - "erp"
    - "crm"
    - "firewall"
    - "switch"
    - "router"
    - "backup"

# ------------------------------------------------------------------------------
# 5. Client & Sector Classification
# ------------------------------------------------------------------------------
classification:
  clients_master_file: "data/clients.csv"
  sectors_file: "data/sectors.yaml"
  clients_pending_file: "data/clients_pending.csv"
  confidence_threshold: 0.75
  llm:
    enabled: false
    provider: "gemini"
    model: "gemini-2.5-flash"
    temperature: 0.0
    timeout_seconds: 15
    max_retries: 2
    strip_sensitive_fields: true

# ------------------------------------------------------------------------------
# 6. Output & Excel Reporting
# ------------------------------------------------------------------------------
output:
  translate_titles: false

excel:
  mode: "both"
  output_dir: "output/reports"
  daily_filename_pattern: "KBM_Tenders_{date}.xlsx"
  latest_filename: "KBM_Tenders_Latest.xlsx"
  closing_soon_days: 7
  sheets:
    - summary
    - new_today
    - all_open
    - by_sector
    - by_client
    - needs_review
    - run_log

# ------------------------------------------------------------------------------
# 7. Delivery & Notifications
# ------------------------------------------------------------------------------
delivery:
  destinations:
    - "local"

notify:
  channels:
    - "console"
    - "log"
  recipients:
    - "kabed@kbm.com.kw"
  send_daily_summary: true
  alert_on_challenge: true
  alert_on_session_conflict: true

# ------------------------------------------------------------------------------
# 8. Scheduling & Execution
# ------------------------------------------------------------------------------
schedule:
  cron: "0 6 * * 0-4" # 06:00 AM Sun-Thu
  timezone: "Asia/Kuwait"
  active_days:
    - "Sunday"
    - "Monday"
    - "Tuesday"
    - "Wednesday"
    - "Thursday"

# ------------------------------------------------------------------------------
# 9. Secrets Vault Strategy
# ------------------------------------------------------------------------------
secrets:
  provider: "env"
