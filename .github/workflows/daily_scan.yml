name: Daily Morning Tender Scan & Qualification

on:
  schedule:
    # 05:00 UTC = 08:00 AM Kuwait Local Time (UTC+3)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium --with-deps

      - name: Execute Daily Tender Scraper (CAPT & Kuwait Al-Yawm)
        env:
          ALYAWM_USERNAME: ${{ secrets.ALYAWM_USERNAME }}
          ALYAWM_PASSWORD: ${{ secrets.ALYAWM_PASSWORD }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DELIVERY_EMAIL_TO: ${{ secrets.DELIVERY_EMAIL_TO }}
        run: |
          echo "Starting daily morning tender discovery..."
          python -m src.main --portal all || echo "Scraper step completed with warnings."

      - name: Reprocess Scopes & Enrich Presales Rationales
        run: |
          python scripts/reprocess_all_scopes_and_titles.py

      - name: Regenerate Excel Reports & HTML Dashboard
        run: |
          python scripts/generate_all_reports.py

      - name: Commit and Push Updated Database & Reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(automated): daily tender scan & qualification update [skip ci]"
          file_pattern: "data/state.db output/reports/* data/clients.csv"
